name: Telegram Notification on New Report

on:
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram notification
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TITLE: ${{ github.event.release.name }}
          URL: ${{ github.event.release.html_url }}
        run: |
          # Send notification with report title and link
          TEXT=$(printf '📄 *New Report Published on Webthreepedia*\n\n*%s*\n\n🔗 [Read on GitHub](%s)\n🌐 [View on webthreepedia.com](https://webthreepedia.com)' "$TITLE" "$URL")

          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg chat_id "$CHAT_ID" \
              --arg text "$TEXT" \
              '{chat_id: $chat_id, text: $text, parse_mode: "Markdown"}')"
